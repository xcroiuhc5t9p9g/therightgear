<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E36" />
      <stop offset="50%" stop-color="#E30613" />
      <stop offset="100%" stop-color="#A60009" />
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E30613" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Premium Container Tile -->
  <rect width="128" height="128" rx="28" fill="#0D1019" />
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#212a3e" stroke-width="2" />

  <!-- Centered Double Apex Swoop Mark -->
  <g transform="translate(12, 26) scale(0.66)" filter="url(#redGlow)">
    <!-- Outer Apex Swoop -->
    <path 
      d="M 10,72 C 35,72 110,40 185,8 C 120,26 70,50 45,66 C 35,72 20,72 10,72 Z" 
      fill="url(#favRedGrad)" 
    />
    <!-- Inner Apex Swoop -->
    <path 
      d="M 70,72 C 92,72 132,42 158,22 C 126,33 100,53 84,66 C 80,70 75,72 70,72 Z" 
      fill="url(#favRedGrad)" 
    />
    <!-- Base Red Underline & Telemetry Stripes -->
    <rect x="65" y="74" width="60" height="7" rx="2" fill="#E30613" />
    <rect x="131" y="74" width="10" height="7" rx="1.5" fill="#E30613" transform="skewX(-15)" />
    <rect x="145" y="74" width="10" height="7" rx="1.5" fill="#E30613" transform="skewX(-15)" />
    <rect x="159" y="74" width="10" height="7" rx="1.5" fill="#E30613" transform="skewX(-15)" />
  </g>
</svg>
